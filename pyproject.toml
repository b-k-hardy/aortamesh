[project]
name = "aortamesh"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Brandon Hardy", email = "59355744+b-k-hardy@users.noreply.github.com" }
]
requires-python = ">=3.14"
dependencies = [
    "gmsh>=4.15.2",
    "h5py>=3.16.0",
    "meshio>=5.3.5",
    "numpy>=2.5.5",
    "pyvista>=0.49.2",
    "scipy>=1.18.1",
]

[project.scripts]
aortamesh = "aortamesh:main"

[build-system]
requires = ["uv_build>=0.13.9,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "jupyter>=1.1.1",
    "pytest>=9.2.0",
    "ruff>=0.17.6",
]
